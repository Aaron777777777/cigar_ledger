name: cigar_ledger
description: "Cigar price intelligence for UK buyers"
publish_to: 'none'

version: 1.0.50+52

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2
  share_plus: ^7.2.1
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  in_app_purchase: ^3.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/cigars/
    - assets/brands/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#000000"